# Основные настройки Tender Intelligence Agent
# Скопируйте в config.yaml и отредактируйте под себя.

app:
  name: "Tender Intelligence Agent"
  timezone: "Europe/Moscow"

scheduler:
  interval_minutes: 60
  run_on_start: true

collectors:
  eis:
    enabled: true
    lookback_days: 3
    request_delay_seconds: 2
    max_pages: 5
    records_per_page: 10
  b2b_center:
    enabled: true
    lookback_days: 3
    request_delay_seconds: 1
    max_pages: 1
    timeout_seconds: 30
  unipro:
    enabled: true
    max_pages: 5
    request_delay_seconds: 2
    timeout_seconds: 30
  rts_tender:
    enabled: true
    timeout_seconds: 30
    max_results: 100
  tmk:
    enabled: true
    timeout_seconds: 30
    max_results: 100
  rosatom:
    enabled: true
    timeout_seconds: 45
    max_results: 100

filters:
  min_text_length: 10

ai:
  min_relevance_score: 70
  use_stub_when_no_key: true

notifications:
  telegram:
    enabled: true
    dry_run_when_no_token: true

storage:
  database_path: "data/tenders.db"

logging:
  file: "logs/agent.log"
  max_bytes: 5242880
  backup_count: 3
