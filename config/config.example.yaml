# Основные настройки Tender Intelligence Agent
# Скопируйте в config.yaml и отредактируйте под себя.

app:
  name: "Tender Intelligence Agent"
  timezone: "Europe/Moscow"

scheduler:
  interval_minutes: 60
  run_on_start: true

search:
  max_pages_per_keyword: 20
  max_results_per_platform: 500
  concurrency: 6

collectors:
  eis:
    enabled: true
    lookback_days: 3
    request_delay_seconds: 2
    max_pages: 5
    records_per_page: 10
  b2b_center:
    enabled: true
    lookback_days: 3
    request_delay_seconds: 1
    max_pages: 20
    page_size: 20
    max_results: 500
    timeout_seconds: 30
  fabrikant:
    enabled: true
    timeout_seconds: 45
    max_results: 200
  rts_tender:
    enabled: true
    timeout_seconds: 30
    max_results: 200
  tmk:
    enabled: true
    timeout_seconds: 30
    max_results: 200
  rosatom:
    enabled: true
    timeout_seconds: 45
    max_results: 200

filters:
  min_text_length: 10

# ИИ работает локально через Ollama. OpenAI/API-ключ не используется.
ai:
  provider: "ollama"
  model: "qwen3:8b"
  ollama_url: "http://localhost:11434"
  min_relevance_score: 70
  # false = при недоступном Ollama цикл сообщает об ошибке, а не подменяет ИИ заглушкой.
  use_stub_when_no_key: false

notifications:
  telegram:
    enabled: true
    dry_run_when_no_token: true

storage:
  database_path: "data/tenders.db"

logging:
  file: "logs/agent.log"
  max_bytes: 5242880
  backup_count: 3
