# Основные настройки Tender Intelligence Agent
# Скопируйте в config.yaml и отредактируйте под себя.

app:
  name: "Tender Intelligence Agent"
  timezone: "Europe/Moscow"

scheduler:
  # Как часто проверять новые тендеры (в минутах)
  interval_minutes: 60
  # Запускать проверку сразу при старте программы
  run_on_start: true

# Какие площадки включены (можно добавлять новые без изменения ядра)
collectors:
  eis:
    enabled: true
    # Сколько дней назад искать при первом запуске
    lookback_days: 3
    # Пауза между запросами к ЕИС (секунды) — не перегружайте сервер
    request_delay_seconds: 2
    # Максимум страниц результатов за один цикл
    max_pages: 5
    records_per_page: 10
  b2b_center:
    enabled: true
    lookback_days: 3
    request_delay_seconds: 1
    max_pages: 1
    timeout_seconds: 30
  unipro:
    enabled: true
    max_pages: 5
    request_delay_seconds: 2
    timeout_seconds: 30

filters:
  # Минимальная длина текста для проверки ключевых слов
  min_text_length: 10

ai:
  # Минимальная оценка релевантности (0–100) для отправки в Telegram
  min_relevance_score: 70
  # Если API-ключ не задан — использовать заглушку (без реального ИИ)
  use_stub_when_no_key: true

notifications:
  telegram:
    enabled: true
    # Если токен не задан — только логировать, не отправлять
    dry_run_when_no_token: true

storage:
  database_path: "data/tenders.db"

logging:
  file: "logs/agent.log"
  max_bytes: 5242880
  backup_count: 3
