name: Apply STEP-51 residual patch

on:
  push:
    paths:
      - "PATCHES/step51-residual.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify patch applies cleanly
        run: git apply --check PATCHES/step51-residual.patch

      - name: Apply patch
        run: git apply --index PATCHES/step51-residual.patch

      - name: Run STEP-51 regression tests
        env:
          PYTHONPATH: .
        run: |
          python test_b2b_parser.py
          pytest -q tests/test_browser_public_parser.py tests/test_eis_commercial_adapter.py tests/test_fabrikant_v3_date_contract.py tests/test_tenderguru_fallback.py

      - name: Commit applied changes and remove bootstrap files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f PATCHES/step51-residual.patch .github/workflows/apply-step51-residual.yml
          git add -A
          git commit -m "fix: apply STEP-51 residual regressions"
          git push origin HEAD:main
