name: Platform Browser Diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/PROJECT_CHECKPOINT_*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/PROJECT_CHECKPOINT_*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-browser-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probe all supported public tender portals
        run: python tests/platform_browser_diagnostics.py

      - name: Validate diagnostics artifacts
        if: always()
        env:
          PYTHONPATH: .
        run: |
          test -s output/platform_browser_diagnostics/report.json
          test -s output/platform_browser_diagnostics/summary.md
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("output/platform_browser_diagnostics")
          report = json.loads((out / "report.json").read_text(encoding="utf-8"))
          targets = ("eis", "b2b_center", "fabrikant_223", "fabrikant_44", "rts_tender", "tmk", "rosatom")
          for name in targets:
              entry = report.get(name)
              assert isinstance(entry, dict), f"missing report entry: {name}"
              state = entry.get("diagnostic_state")
              # Access blocks/timeouts are valid external diagnostics and may not
              # have a screenshot because their process can be terminated. For
              # every probe that reached a page, however, the screenshot is a
              # mandatory artifact so parser/UI failures remain inspectable.
              if state not in {"external_timeout", "http_access_block", "waf_or_block", "missing"}:
                  screenshot = out / f"{name}.png"
                  assert screenshot.is_file() and screenshot.stat().st_size > 0, f"missing screenshot: {name}"
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-browser-diagnostics
          path: output/platform_browser_diagnostics/
          if-no-files-found: error
          retention-days: 7
