name: Platform Browser Diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/PROJECT_CHECKPOINT_*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Probe all supported public tender portals
        env:
          HARD_EXTERNAL_ACCESS: "0"
          PLATFORM_DIAGNOSTIC_QUERIES: "станок,подшипник,лебедка"
          PYTHONPATH: .
        run: python tests/platform_browser_diagnostics.py

      - name: Validate diagnostics artifacts
        if: always()
        run: |
          test -s output/platform_browser_diagnostics/report.json
          test -s output/platform_browser_diagnostics/summary.md
          test -s output/platform_browser_diagnostics/eis.png
          test -s output/platform_browser_diagnostics/b2b_center.png
          test -s output/platform_browser_diagnostics/fabrikant_223.png
          test -s output/platform_browser_diagnostics/fabrikant_44.png
          test -s output/platform_browser_diagnostics/rts_tender.png
          test -s output/platform_browser_diagnostics/tmk.png
          test -s output/platform_browser_diagnostics/rosatom.png
          HARD_EXTERNAL_ACCESS=0 python tests/platform_browser_diagnostics_gate.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-browser-diagnostics
          path: output/platform_browser_diagnostics/
          if-no-files-found: error
          retention-days: 7
