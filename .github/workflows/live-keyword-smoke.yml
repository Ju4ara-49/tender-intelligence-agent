name: Live Keyword Smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/live_keyword_smoke.py"
      - ".github/workflows/live-keyword-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-keyword-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run live keyword smoke
        run: python tests/live_keyword_smoke.py

      - name: Validate report
        if: always()
        run: test -s output/live_keyword_smoke/report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-keyword-smoke
          path: output/live_keyword_smoke/
          if-no-files-found: error
          retention-days: 7
